name: scms

services:
  nginx:
    image: nginx:1.27.4-alpine
    ports:
      - "8080:80"
    volumes:
      - ./frontend/index.html:/usr/share/nginx/html/index.html:ro
      - ./frontend/css:/usr/share/nginx/html/css:ro
      - ./frontend/js:/usr/share/nginx/html/js:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - edge

  bootstrap:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["python", "-m", "scripts.bootstrap_demo"]
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      SCMS_ENV: ${SCMS_ENV:-demo}
      SCMS_ALLOW_DEMO_SEED: ${SCMS_ALLOW_DEMO_SEED:-0}
      SCMS_DEMO_PASSWORD: ${SCMS_DEMO_PASSWORD:-}
      SCMS_DEMO_PASSWORD_HASH: ${SCMS_DEMO_PASSWORD_HASH:-}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - data

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    expose:
      - "8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      SCMS_ENV: ${SCMS_ENV:-demo}
      SCMS_JWT_SECRET: ${SCMS_JWT_SECRET:?Set SCMS_JWT_SECRET in .env}
      SCMS_JWT_ISSUER: ${SCMS_JWT_ISSUER:-scms-local}
      SCMS_JWT_AUDIENCE: ${SCMS_JWT_AUDIENCE:-scms-api}
      SCMS_AUTH_ALLOWED_ORIGINS: ${SCMS_AUTH_ALLOWED_ORIGINS:-http://localhost:8080}
      SCMS_COOKIE_SECURE: ${SCMS_COOKIE_SECURE:-false}
    depends_on:
      mysql:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - edge
      - data

  mysql:
    image: mysql:8.4.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE in .env}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP --host=127.0.0.1 --user="$${MYSQL_USER}" --database="$${MYSQL_DATABASE}" --execute="SELECT 1" --silent --skip-column-names
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - data

volumes:
  mysql_data:

networks:
  edge:
  data:
    internal: true
